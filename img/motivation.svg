<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <path id="star" d="M0,-15 L4.4,-4.6 15,-4.6 6.5,2.2 9.3,12.8 0,6.4 -9.3,12.8 -6.5,2.2 -15,-4.6 -4.4,-4.6Z"/>
  </defs>

  <!-- Panel 1: conceptual distance -->
  <rect x="10" y="10" width="460" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#24292f">Paper vs. its references</text>
  <text x="30" y="70" font-size="17" fill="#57606a">far from what it cites → new results</text>

  <g stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5" opacity="0.8">
    <line x1="380" y1="190" x2="110" y2="160"/>
    <line x1="380" y1="190" x2="140" y2="200"/>
    <line x1="380" y1="190" x2="100" y2="215"/>
    <line x1="380" y1="190" x2="150" y2="150"/>
    <line x1="380" y1="190" x2="125" y2="245"/>
    <line x1="380" y1="190" x2="165" y2="228"/>
  </g>
  <g fill="#1f6feb">
    <circle cx="110" cy="160" r="9"/><circle cx="140" cy="200" r="9"/>
    <circle cx="100" cy="215" r="9"/><circle cx="150" cy="150" r="9"/>
    <circle cx="125" cy="245" r="9"/><circle cx="165" cy="228" r="9"/>
  </g>
  <use href="#star" transform="translate(380,190) scale(1.5)" fill="#e8590c"/>
  <text x="380" y="235" font-size="17" text-anchor="middle" fill="#e8590c" font-weight="700">paper</text>
  <text x="130" y="288" font-size="17" text-anchor="middle" fill="#1f6feb">references</text>
  <text x="265" y="128" font-size="19" text-anchor="middle" fill="#24292f" font-family="DejaVu Sans Mono, monospace">paper_ref</text>

  <!-- Panel 2: knowledge recombination -->
  <rect x="10" y="330" width="460" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="30" y="364" font-size="22" font-weight="700" fill="#24292f">References vs. each other</text>
  <text x="30" y="390" font-size="17" fill="#57606a">distant ideas combined → recombination</text>

  <g stroke="#1f6feb" stroke-width="1.6" opacity="0.45">
    <line x1="70" y1="440" x2="400" y2="430"/><line x1="70" y1="440" x2="90" y2="590"/>
    <line x1="70" y1="440" x2="420" y2="580"/><line x1="70" y1="440" x2="250" y2="600"/>
    <line x1="400" y1="430" x2="90" y2="590"/><line x1="400" y1="430" x2="420" y2="580"/>
    <line x1="400" y1="430" x2="250" y2="600"/><line x1="90" y1="590" x2="420" y2="580"/>
    <line x1="90" y1="590" x2="250" y2="600"/><line x1="420" y1="580" x2="250" y2="600"/>
  </g>
  <g fill="#1f6feb">
    <circle cx="70" cy="440" r="9"/><circle cx="400" cy="430" r="9"/>
    <circle cx="90" cy="590" r="9"/><circle cx="420" cy="580" r="9"/>
    <circle cx="250" cy="600" r="9"/>
  </g>
  <use href="#star" transform="translate(245,505) scale(1.5)" fill="#e8590c"/>
  <text x="245" y="548" font-size="17" text-anchor="middle" fill="#e8590c" font-weight="700">paper</text>
  <text x="235" y="424" font-size="19" text-anchor="middle" fill="#24292f" font-family="DejaVu Sans Mono, monospace">ref_ref</text>
</svg>
